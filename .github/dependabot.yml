version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      # inquirer ≥9 is ESM-only; the app still uses the CommonJS API.
      - dependency-name: "inquirer"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"